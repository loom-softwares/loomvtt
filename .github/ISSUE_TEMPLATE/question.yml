name: ❓ Question
description: Ask a general question about LoomVTT usage, addons, or systems.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        > 💬 **Quick questions are often answered faster on [Discord](https://discord.gg/loomvtt).**
        
        Use this form for questions that might benefit others if documented as a GitHub issue.

  - type: dropdown
    id: area
    attributes:
      label: Question Area
      options:
        - General usage
        - Addon / Module development
        - Ruleset / System development
        - SDK / API
        - Hosting / Server setup
        - Multiplayer / Networking
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LoomVTT Version
      placeholder: "e.g. 0.5.2"

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Be as specific as possible.
      placeholder: "How do I register a custom sheet for my System's Actor type?"
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Describe any docs you've read, code you've attempted, or workarounds you've explored.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Paste relevant code snippets, error messages, or screenshots here.
