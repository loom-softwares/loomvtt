name: 🐛 Bug Report
description: Report a bug or unexpected behavior in LoomVTT.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible so we can reproduce and fix it.
        
        **Before submitting:** Check [existing issues](../../issues) to see if this has already been reported.

  - type: input
    id: version
    attributes:
      label: LoomVTT Version
      description: What version of LoomVTT are you running? (visible in the bottom-left corner of the Setup Hub)
      placeholder: "e.g. 0.5.2"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: How are you running LoomVTT?
      options:
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Browser (self-hosted server)
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / Client Version
      description: If using via browser, which browser and version? (e.g. Chrome 126, Firefox 127)
      placeholder: "e.g. Chrome 126 / N/A (Desktop app)"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "Describe the unexpected behavior..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Describe the expected behavior..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reliably reproduce the issue.
      placeholder: |
        1. Open LoomVTT and load a World
        2. Navigate to '...'
        3. Click on '...'
        4. See the error
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Always (100%)
        - Often (>50%)
        - Sometimes (~50%)
        - Rarely (<25%)
        - Once (couldn't reproduce again)
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recording
      description: Drag and drop screenshots or a video here. Highly recommended for UI bugs.

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Paste any relevant error messages from the console or LoomVTT log files.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information — active addons, ruleset, world settings, etc.
