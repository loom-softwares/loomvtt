name: Welcome New Contributors

on:
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    permissions:
      issues: write
    steps:
      - name: Check if first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.issue.user.login;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: creator,
              state: 'all',
              per_page: 5,
            });

            const previousIssues = issues.filter(i => i.number !== context.payload.issue.number);

            if (previousIssues.length === 0) {
              const body = [
                '👋 **Thanks for opening your first issue, @' + creator + '!**',
                '',
                "We appreciate you taking the time to report this. Here's what happens next:",
                '',
                '1. A maintainer will review and triage your issue soon.',
                '2. If we need more information, we\'ll add the `needs-info` label and follow up.',
                '3. You\'ll be notified of any updates via GitHub notifications.',
                '',
                'In the meantime, feel free to join our [Discord community](https://discord.gg/loomvtt) to chat with other LoomVTT users and the development team. 🧵',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: body,
              });
            }
